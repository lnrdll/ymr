templates:
  - service.yaml

targetIds:
  - dev
  - prd

validations:
  - rule: "params.minScale >= 1"
    message: "minScale cannot be negative or zero"
    targetId: ["prd"]

  - rule: "params.minScale <= params.maxScale"
    message: "minScale must be less than or equal to maxScale"
    targetId: ["prd"]

parameters:
  # --- Shared values ---
  - targetId: ["dev", "prd"] # Which targets this value set applies to
    values:
      version: 1.1.1
      name: "myapp-name"

  # --- Dev-specific values ---
  - targetId: ["dev"]
    values:
      minScale: 1

  # --- Prod-specific values ---
  - targetId: ["prd"]
    values:
      minScale: 2
      maxScale: 10

