templates:
  - service.yaml

targetIds:
  - dev
  - prd

parameters:
  # --- Shared values for dev and prd ---
  - values:
      concurrency: 250
    targetId:
      - dev
      - prd

  # --- Dev-specific values ---
  - targetId: ["dev"]
    values:
      minScale: 1
      serviceAccount: my-service-account@dev-project.iam.gserviceaccount.com
      version: 2025.11.17
      envVars:
        - name: HELLO
          value: world
        - name: hello
          value: WORLD

  # --- Prod-specific values ---
  - targetId: ["prd"]
    values:
      minScale: 3
      serviceAccount: my-service-account@prd-project.iam.gserviceaccount.com
      version: 2025.10.17
