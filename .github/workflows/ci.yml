name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run tests
        run: |
          go vet ./...
          go test -race ./...

  release-builds:
    if: github.event_name == 'release'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          LDFLAGS="-X 'main.version=${VERSION}' -X 'main.commit=${COMMIT}' -X 'main.date=${DATE}'"

          case "$GOOS" in
            darwin) goos_label="Darwin" ;;
            linux) goos_label="Linux" ;;
            windows) goos_label="Windows" ;;
            *) goos_label="$GOOS" ;;
          esac
          case "$GOARCH" in
            amd64) goarch_label="x86_64" ;;
            arm64) goarch_label="arm64" ;;
            *) goarch_label="$GOARCH" ;;
          esac
          output="dist/ymr_${goos_label}_${goarch_label}"
          if [ "$GOOS" = "windows" ]; then
            output="${output}.exe"
          fi

          echo "Building version $VERSION"
          GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags "$LDFLAGS" -o "$output" ./cmd
          sha256sum "$output" | awk '{print $1}' > "${output}.sha256"
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
